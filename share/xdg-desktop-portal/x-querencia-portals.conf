# xdg-desktop-portal: backends for XDG_CURRENT_DESKTOP=X-Querencia (QD-062).
# Without this file xdg-desktop-portal picks the GTK backend only as a
# "last-resort fallback", separately for every interface. GTK for every
# interface, gnome-keyring for Secret. No "*" (QD-077): on Ubuntu Desktop
# "*" also pulls in xdg-desktop-portal-gnome, which waits for GNOME Shell
# outside a GNOME session and keeps every portal client hanging for about
# two minutes.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
