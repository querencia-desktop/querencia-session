# xdg-desktop-portal: backends for XDG_CURRENT_DESKTOP=X-Querencia (QD-062).
# Without this file xdg-desktop-portal picks the GTK backend only as a
# "last-resort fallback", separately for every interface. GTK first, any
# other backend for interfaces GTK does not provide (e.g. Secret:
# gnome-keyring).
[preferred]
default=gtk;*
